[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantization-three-gaps-bounds"
version = "0.1.0"
description = "Theoretical bounds for the three quantization gaps in learned image compression"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Walker Kirkpatrick"}]
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["quantization_three_gaps_bounds*"]